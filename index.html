<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen — Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#101010;--bg2:#181818;--card:#202020;--tx:#fff;--tx2:#a0a0a0;--ac:#b8a1ff;--line:rgba(255,255,255,.08);--r:16px;--nav:68px;--bar:64px;font-family:Manrope,system-ui,sans-serif}
[data-theme=light]{--bg:#f6f5f2;--bg2:#fff;--card:#ececea;--tx:#141414;--tx2:#6b6b6b;--ac:#7550e0;--line:rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);overflow:hidden;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
i[data-lucide],svg.lucide{width:22px;height:22px;stroke-width:1.75}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:20}
#nav .brand{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--tx2);transition:color .2s}
#nav button.on{color:var(--ac)}
#nav button.on svg{transform:translateY(-1px) scale(1.08)}
#nav svg{transition:transform .25s}

/* view */
#view{position:fixed;inset:0 0 calc(var(--nav) + env(safe-area-inset-bottom));overflow-y:auto;scroll-behavior:smooth;padding:calc(18px + env(safe-area-inset-top)) 20px 32px}
body.has-bar #view{bottom:calc(var(--nav) + var(--bar) + env(safe-area-inset-bottom))}
.page{animation:in .3s ease both;max-width:980px;margin:auto}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.logo{display:flex;gap:8px;align-items:center;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo svg{color:var(--ac)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:14px 0 16px}
h3{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:26px 0 12px}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);padding:0 14px;height:48px;border:1px solid var(--line)}
.field input{flex:1;background:none;border:0;outline:0;min-width:0}
.field svg{color:var(--tx2);flex:none}
.field:focus-within{border-color:var(--ac)}

/* cards */
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.card{flex:none;width:140px;scroll-snap-align:start;text-align:left}
.card .art{width:140px;height:140px;border-radius:var(--r);overflow:hidden;background:var(--card)}
.card img,.art img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card:hover img{transform:scale(1.05)}
.card b,.item b{display:block;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small,.item small{color:var(--tx2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph{display:grid;place-items:center;width:100%;height:100%;color:var(--tx2);background:var(--card)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);animation:in .25s both}
.item .art{width:48px;height:48px;border-radius:10px;overflow:hidden;flex:none}
.item .t{flex:1;min-width:0;text-align:left}.item .t b{margin:0}
.item .on{color:var(--ac)}
.ic{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--tx);transition:background .2s,transform .15s}
.ic:hover{background:var(--line)}.ic:active{transform:scale(.92)}
.ic.act,.ic.fav{color:var(--ac)}
.ic.fav svg{fill:var(--ac)}
.main{background:var(--tx);color:var(--bg)}.main:hover{background:var(--tx)}
.big{width:68px;height:68px}.big svg{width:28px;height:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--ac);color:#111;font-weight:700}
.btn.ghost{background:var(--card);color:var(--tx)}
.btn.danger{background:#ff6b6b}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.empty{padding:36px 16px;text-align:center;color:var(--tx2);border:1px dashed var(--line);border-radius:var(--r)}
.empty svg{width:30px;height:30px;margin-bottom:8px}
.empty p{margin-bottom:12px}
.skel{height:140px;width:140px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--bg2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:8px 0}
.tabs button{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--tx2);font-weight:600;font-size:13px}
.tabs button.on{background:var(--ac);color:#111}
select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px}
.set{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.set small{display:block;color:var(--tx2)}

/* spotify embed */
#spotify{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + var(--bar) + 10px + env(safe-area-inset-bottom));z-index:15;border-radius:var(--r);overflow:hidden;display:none;box-shadow:0 10px 40px #0008}
#spotify.show{display:block;animation:in .3s}
#spotify iframe{width:100%;height:152px;border:0;display:block}

/* mini bar */
#bar{position:fixed;left:8px;right:8px;bottom:calc(var(--nav) + 6px + env(safe-area-inset-bottom));height:var(--bar);display:flex;align-items:center;gap:10px;padding:0 10px 0 8px;border-radius:var(--r);background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(18px);border:1px solid var(--line);z-index:19;animation:in .3s;cursor:pointer;overflow:hidden}
#bar[hidden]{display:none}
#bar img{width:46px;height:46px;border-radius:10px;object-fit:cover}
#bar .meta{flex:1;min-width:0}#bar b,#bar small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar small{color:var(--tx2)}
#bar-prog{position:absolute;left:0;right:0;bottom:0;height:2px}
#bar-prog i{display:block;height:100%;width:0;background:var(--ac)}

/* now playing */
#np{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));transform:translateY(0);transition:transform .38s cubic-bezier(.2,.8,.2,1);max-width:520px;margin:auto;overflow-y:auto}
#np[hidden]{display:flex;transform:translateY(100%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s}
#np header{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--tx2)}
#np-art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:24px;margin:18px 0;box-shadow:0 24px 60px #0007;max-height:46vh;width:auto;align-self:center}
.np-meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.np-meta h2{font-size:23px;letter-spacing:-.02em}.np-meta p{color:var(--tx2)}
.seek{margin:18px 0 6px}.seek div{display:flex;justify-content:space-between;color:var(--tx2);font-size:12px;margin-top:4px}
input[type=range]{width:100%;accent-color:var(--ac);height:20px;background:none}
.ctrl{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.vol{display:flex;align-items:center;gap:10px;color:var(--tx2);margin-top:auto;padding-top:14px}

/* modal / toast */
#modal{position:fixed;inset:0;z-index:60;background:#0009;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
#modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:80vh;overflow:auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:22px;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin-top:0}.sheet .field{margin:10px 0}.sheet p{color:var(--tx2);margin-bottom:8px}
.err{color:#ff8a8a;min-height:20px;font-size:13px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-80px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:80;transition:transform .3s;max-width:90vw}
#toast.show{transform:translate(-50%,0)}

/* desktop */
@media(min-width:900px){
  #nav{top:0;right:auto;width:220px;height:auto;flex-direction:column;padding:28px 14px;border-top:0;border-right:1px solid var(--line);gap:4px}
  #nav .brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:20px;padding:0 12px 24px;color:var(--ac)}
  #nav .brand span{color:var(--tx)}
  #nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:12px;border-radius:12px}
  #nav button.on{background:var(--card)}
  #view,body.has-bar #view{left:220px;bottom:0}
  body.has-bar #view{bottom:calc(var(--bar) + 20px)}
  #bar{left:236px;right:16px;bottom:12px}
  #spotify{left:auto;right:16px;width:380px;bottom:calc(var(--bar) + 24px)}
  #np{border-radius:24px;inset:20px 0}
  .card,.card .art{width:168px}.card .art{height:168px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#yt{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + var(--bar) + 10px + env(safe-area-inset-bottom));z-index:15;border-radius:16px;overflow:hidden;display:none;aspect-ratio:16/9;max-height:34vh;background:#000;box-shadow:0 10px 40px #0008}
#yt.show{display:block;animation:in .3s}#yt iframe{width:100%;height:100%;display:block}
@media(min-width:900px){#yt{left:auto;right:16px;width:380px;bottom:calc(var(--bar) + 24px)}}
</style>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<nav id="nav">
  <div class="brand"><i data-lucide="audio-lines"></i><span>Lumen</span></div>
  <button data-page="home" class="on"><i data-lucide="house"></i><span>Home</span></button>
  <button data-page="search"><i data-lucide="search"></i><span>Search</span></button>
  <button data-page="library"><i data-lucide="library"></i><span>Library</span></button>
  <button data-page="settings"><i data-lucide="settings"></i><span>Settings</span></button>
</nav>
<main id="view"></main>

<div id="spotify"><iframe id="sp-frame" title="Spotify" allow="encrypted-media" loading="lazy"></iframe></div>

<div id="yt"><div id="yt-box"></div></div>

<div id="bar" hidden>
  <img id="bar-art" alt=""><div class="meta"><b id="bar-title"></b><small id="bar-artist"></small></div>
  <button class="ic" id="bar-fav" aria-label="Favorite"><i data-lucide="heart"></i></button>
  <button class="ic main" id="bar-play" aria-label="Play"><i data-lucide="play"></i></button>
  <div id="bar-prog"><i></i></div>
</div>

<section id="np" hidden>
  <header><button class="ic" id="np-close" aria-label="Close"><i data-lucide="chevron-down"></i></button><span>Now playing</span><button class="ic" id="np-queue" aria-label="Queue"><i data-lucide="list-music"></i></button></header>
  <img id="np-art" alt="">
  <div class="np-meta"><div><h2 id="np-title"></h2><p id="np-artist"></p></div><button class="ic" id="np-fav" aria-label="Favorite"><i data-lucide="heart"></i></button></div>
  <div class="seek"><input type="range" id="seek" min="0" max="100" value="0" step="0.1"><div><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div></div>
  <div class="ctrl">
    <button class="ic" id="c-shuf" aria-label="Shuffle"><i data-lucide="shuffle"></i></button>
    <button class="ic" id="c-prev" aria-label="Previous"><i data-lucide="skip-back"></i></button>
    <button class="ic main big" id="c-play" aria-label="Play"><i data-lucide="play"></i></button>
    <button class="ic" id="c-next" aria-label="Next"><i data-lucide="skip-forward"></i></button>
    <button class="ic" id="c-rep" aria-label="Repeat"><i data-lucide="repeat"></i></button>
  </div>
  <div class="vol"><i data-lucide="volume-1"></i><input type="range" id="vol" min="0" max="1" step="0.01" value="1"></div>
</section>

<div id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="files" accept=".mp3,.wav,.ogg,.m4a,audio/*" multiple hidden>
<script>
'use strict';
/* ===== State & storage ===== */
const KEY = 'lumen.v1';
const blank = () => ({ songs: [], playlists: [], favs: [], recent: [], theme: 'dark', quality: 'high' });
let S = load();
const blobs = {}; // id -> object URL (local files live only for this session)
function load() { try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY))); } catch { return blank(); } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast('Penyimpanan penuh'); } }

/* ===== Helpers ===== */
const $ = (q, r = document) => r.querySelector(q);
const view = $('#view'), audio = new Audio();
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = t => isFinite(t) && t > 0 ? `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}` : '0:00';
const song = id => S.songs.find(s => s.id === id);
const art = s => s?.art || 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#2a2a2a"/><circle cx="5" cy="5" r="2.2" fill="none" stroke="#b8a1ff" stroke-width=".4"/><circle cx="5" cy="5" r=".5" fill="#b8a1ff"/></svg>`);
const icons = () => window.lucide && lucide.createIcons();
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }
const greet = () => { const h = new Date().getHours(); return h < 11 ? 'Good morning' : h < 15 ? 'Good afternoon' : h < 19 ? 'Good evening' : 'Good night'; };
function applyTheme() { document.documentElement.dataset.theme = S.theme; }

/* ===== Modal ===== */
function openModal(html) { $('#sheet').innerHTML = html; $('#modal').hidden = false; icons(); const i = $('#sheet input'); i && setTimeout(() => i.focus(), 50); }
function closeModal() { $('#modal').hidden = true; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function ask(title, value, ok, cb) {
  openModal(`<h3>${esc(title)}</h3><div class="field"><input id="ask" value="${esc(value)}" maxlength="60"></div><div class="actions"><button class="btn" id="ok">${esc(ok)}</button><button class="btn ghost" data-close>Batal</button></div>`);
  const go = () => { const v = $('#ask').value.trim(); if (v) { closeModal(); cb(v); } };
  $('#ok').onclick = go; $('#ask').onkeydown = e => e.key === 'Enter' && go();
}
function confirmBox(msg, cb) {
  openModal(`<h3>Konfirmasi</h3><p>${esc(msg)}</p><div class="actions"><button class="btn danger" id="ok">Ya, lanjutkan</button><button class="btn ghost" data-close>Batal</button></div>`);
  $('#ok').onclick = () => { closeModal(); cb(); };
}
document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });

/* ===== Player ===== */
let queue = [], qi = -1, shuffle = false, repeat = 0, cur = null;
function playSong(id, list) {
  const s = song(id); if (!s) return;
  if (list) { queue = list.slice(); }
  if (!queue.includes(id)) queue.push(id);
  qi = queue.indexOf(id); cur = s;
  S.recent = [id, ...S.recent.filter(x => x !== id)].slice(0, 20); save();
  const sp = $('#spotify');
  if (s.src === 'youtube') { audio.pause(); spPlayer && spPlayer.pause(); spLive = false; $('#sp-frame').src = 'about:blank'; sp.classList.remove('show'); ytPlay(s); paint(); return; }
  ytStop();
  if (s.src === 'spotify') {
    audio.pause();
    if (spReady() && s.spType === 'track') { sp.classList.remove('show'); $('#sp-frame').src = 'about:blank'; spPlay(s); }
    else { spLive = false; $('#sp-frame').src = `https://open.spotify.com/embed/${s.spType}/${s.spId}`; sp.classList.add('show'); if (!spReady()) toast('Hubungkan Spotify Premium di Settings untuk lagu penuh'); }
  } else {
    spLive = false; spPlayer && spPlayer.pause();
    sp.classList.remove('show'); $('#sp-frame').src = 'about:blank';
    if (!blobs[s.id]) { toast('File lokal perlu diimpor ulang setelah refresh'); cur = null; return; }
    audio.src = blobs[s.id]; audio.play().catch(() => toast('Tidak bisa memutar file ini'));
  }
  paint();
}
function step(d, auto) {
  if (!queue.length) return;
  if (auto && repeat === 2 && cur && cur.src === 'youtube') { yt.seekTo(0); yt.playVideo(); return; }
  if (auto && repeat === 2) { audio.currentTime = 0; audio.play(); return; }
  let n = shuffle && queue.length > 1 ? Math.floor(Math.random() * queue.length) : qi + d;
  if (n >= queue.length) { if (repeat === 1 || !auto) n = 0; else return paint(); }
  if (n < 0) n = queue.length - 1;
  playSong(queue[n]);
}
function toggle() {
  if (!cur) { const f = S.songs[0]; return f ? playSong(f.id, S.songs.map(x => x.id)) : toast('Library masih kosong'); }
  if (cur.src === 'youtube') return ytLive && (ytPlaying ? yt.pauseVideo() : yt.playVideo());
  if (cur.src === 'spotify') return spLive ? spPlayer.togglePlay() : toast('Gunakan kontrol Spotify di pemutar tersemat');
  audio.paused ? audio.play() : audio.pause();
}
audio.addEventListener('play', paint); audio.addEventListener('pause', paint);
audio.addEventListener('ended', () => step(1, true));
audio.addEventListener('error', () => cur?.src === 'local' && toast('Gagal memuat audio'));
audio.addEventListener('loadedmetadata', () => { $('#t-dur').textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  const p = audio.duration ? audio.currentTime / audio.duration * 100 : 0;
  $('#bar-prog i').style.width = p + '%'; $('#t-cur').textContent = fmt(audio.currentTime);
  if (!seeking) $('#seek').value = p;
});
let seeking = false;
$('#seek').oninput = e => { seeking = true; if (!spLive && !ytLive && audio.duration) audio.currentTime = e.target.value / 100 * audio.duration; };
$('#seek').onchange = () => { seeking = false; if (spLive) spPlayer.seek($('#seek').value / 100 * spDur); else if (ytLive) yt.seekTo($('#seek').value / 100 * ytDur, true); };
$('#vol').oninput = e => { audio.volume = e.target.value; spPlayer && spPlayer.setVolume(+e.target.value); yt && yt.setVolume && yt.setVolume(e.target.value * 100); };

function paint() {
  const has = !!cur; document.body.classList.toggle('has-bar', has); $('#bar').hidden = !has;
  if (has) {
    const playing = cur.src === 'youtube' ? ytPlaying : cur.src === 'spotify' ? (spLive ? spPlaying : true) : !audio.paused, fav = S.favs.includes(cur.id);
    $('#bar-art').src = $('#np-art').src = art(cur);
    $('#bar-title').textContent = $('#np-title').textContent = cur.title;
    $('#bar-artist').textContent = $('#np-artist').textContent = cur.artist;
    $('#t-dur').textContent = cur.src === 'youtube' ? fmt(ytDur) : cur.src === 'spotify' && !spLive ? '—' : fmt(spLive ? spDur / 1000 : (audio.duration || cur.dur));
    $('#seek').disabled = cur.src === 'spotify' && !spLive;
    for (const b of ['#bar-play', '#c-play']) $(b).innerHTML = `<i data-lucide="${playing && (cur.src !== 'spotify' || spLive) ? 'pause' : 'play'}"></i>`;
    for (const b of ['#bar-fav', '#np-fav']) $(b).classList.toggle('fav', fav);
  }
  $('#c-shuf').classList.toggle('act', shuffle);
  $('#c-rep').classList.toggle('act', repeat > 0);
  $('#c-rep').innerHTML = `<i data-lucide="${repeat === 2 ? 'repeat-1' : 'repeat'}"></i>`;
  icons(); document.querySelectorAll('.item .t b').forEach(b => b.classList.toggle('on', cur && b.dataset.id === cur.id));
}
$('#bar-play').onclick = e => { e.stopPropagation(); toggle(); };
$('#bar-fav').onclick = e => { e.stopPropagation(); fav(cur.id); };
$('#bar').onclick = () => $('#np').hidden = false;
$('#np-close').onclick = () => $('#np').hidden = true;
$('#c-play').onclick = toggle; $('#c-next').onclick = () => step(1); $('#c-prev').onclick = () => audio.currentTime > 3 && cur?.src === 'local' ? audio.currentTime = 0 : step(-1);
$('#c-shuf').onclick = () => { shuffle = !shuffle; paint(); };
$('#c-rep').onclick = () => { repeat = (repeat + 1) % 3; paint(); };
$('#np-fav').onclick = () => cur && fav(cur.id);
$('#np-queue').onclick = () => {
  openModal(`<h3>Antrean</h3>${queue.length ? `<div class="list">${queue.map(id => rowHTML(song(id), 'q')).join('')}</div>` : '<p>Antrean kosong.</p>'}`);
};
function fav(id) { S.favs = S.favs.includes(id) ? S.favs.filter(x => x !== id) : [...S.favs, id]; save(); paint(); if (page === 'library') render(); }

/* ===== Importers ===== */

    blobs[id] = url;

    S.songs.push({ id, src: 'local', title: m.length > 1 ? m.slice(1).join(' - ') : name, artist: m.length > 1 ? m[0] : 'Unknown artist', album: 'Imported', dur, added: Date.now(), imported: true }); n++;

function parseSpotify(u) {

}

    if (yp) return ytImport(yp, err, $('#sp-go'));
    if (!p && raw && !/^https?:/i.test(raw)) { window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(raw), '_blank'); return err.textContent = 'Salin link video dari YouTube, lalu tempel di sini.'; }
    if (!p) return err.textContent = 'Link tidak valid. Gunakan link open.spotify.com/track, /album, atau /playlist.';

const SK = 'lumen.spotify';
const SPA = () => { try { return JSON.parse(localStorage.getItem(SK)) || {}; } catch { return {}; } };
const SPW = o => localStorage.setItem(SK, JSON.stringify({ ...SPA(), ...o }));
let spPlayer = null, spDev = null, spLive = false, spPlaying = false, spDur = 0, spPos = 0, spStamp = 0, spLastId = null;
const redirect = () => location.origin + location.pathname;
const spConnected = () => !!SPA().refresh, spReady = () => spConnected() && !!spDev;
const rnd = n => [...crypto.getRandomValues(new Uint8Array(n))].map(x => 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[x % 62]).join('');

  if (!id) return toast('Isi Client ID dulu');

  SPW({ cid: id });

}

}

  if (r.status === 204) return null;
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(r.status === 403 ? 'Akses ditolak (403). Cek: akun sudah ditambahkan di User Management, pemilik app Premium, dan playlist milikmu sendiri.' : (j.error && j.error.message) || 'Spotify error ' + r.status); return j;
}
async function spCallback() {

  if (u.searchParams.get('error')) { history.replaceState({}, '', redirect()); return toast('Login Spotify dibatalkan'); }
  if (!code) return;
  history.replaceState({}, '', redirect());
  try { await tokenReq({ grant_type: 'authorization_code', code, redirect_uri: redirect(), code_verifier: SPA().verifier }); toast('Spotify terhubung'); page = 'settings'; }

function spDisc() { const c = SPA().cid; spPlayer && spPlayer.disconnect(); localStorage.removeItem(SK); SPW({ cid: c }); location.reload(); }
function spInit() {
  if (!spConnected() || document.getElementById('spsdk')) return;
  window.onSpotifyWebPlaybackSDKReady = () => {
    spPlayer = new Spotify.Player({ name: 'Lumen', getOAuthToken: cb => spToken().then(cb), volume: +$('#vol').value });
    spPlayer.addListener('ready', ({ device_id }) => { spDev = device_id; toast('Pemutar Spotify siap'); if (page === 'settings') render(); });
    spPlayer.addListener('not_ready', () => spDev = null);
    for (const k of ['authentication_error', 'account_error', 'initialization_error']) spPlayer.addListener(k, ({ message }) => toast(k === 'account_error' ? 'Butuh akun Spotify Premium' : message));
    spPlayer.addListener('player_state_changed', st => {
      if (!st || !spLive) return;
      const prev = spPlaying; spPlaying = !st.paused; spDur = st.duration; spPos = st.position; spStamp = performance.now();
      const id = st.track_window.current_track.id;
      if (st.paused && st.position === 0 && prev && spLastId === id && st.track_window.previous_tracks.some(t => t.id === id)) step(1, true);
      spLastId = id; paint();
    });
    spPlayer.connect();
  };
  const s = document.createElement('script'); s.id = 'spsdk'; s.src = 'https://sdk.scdn.co/spotify-player.js'; document.head.appendChild(s);
}
async function spPlay(s) {
  spLive = true; spLastId = s.spId; spPlayer.activateElement && spPlayer.activateElement();
  try { await spApi('/me/player/play?device_id=' + spDev, { method: 'PUT', body: JSON.stringify({ uris: ['spotify:track:' + s.spId] }) }); }
  catch (e) { spLive = false; toast(e.message); }
  paint();
}
setInterval(() => {
  if (!spLive || !spPlaying || seeking) return;
  const pos = spPos + performance.now() - spStamp, p = spDur ? pos / spDur * 100 : 0;
  $('#bar-prog i').style.width = p + '%'; $('#seek').value = p; $('#t-cur').textContent = fmt(pos / 1000);
}, 500);
async function spImport(p) {
  let items = [];
  if (p.type === 'track') items = [await spApi('/tracks/' + p.id)];
  else if (p.type === 'album') { const a = await spApi('/albums/' + p.id); items = a.tracks.items.map(t => ({ ...t, album: a })); }
  else { const pl = await spApi('/playlists/' + p.id + '/items?limit=100'); items = pl.items.map(i => i.item || i.track).filter(t => t && t.artists); }
  let n = 0;
  for (const t of items) {
    if (!t.id || S.songs.some(s => s.spId === t.id)) continue;
    const im = (t.album && t.album.images) || [];
    S.songs.push({ id: uid(), src: 'spotify', spType: 'track', spId: t.id, title: t.name, artist: t.artists.map(a => a.name).join(', '), album: (t.album && t.album.name) || 'Spotify', art: (im[1] || im[0] || {}).url || '', dur: t.duration_ms / 1000, added: Date.now(), imported: true }); n++;
  }
  save(); return n;
}
function spSettings() {
  const a = SPA(), on = !!a.refresh;
  return `<div class="set" style="display:block"><b>Spotify — lagu penuh</b><small>Butuh akun Premium dan Client ID. Redirect URI: <code>${esc(redirect())}</code></small>${on
    ? `<p style="margin:10px 0">${spDev ? 'Terhubung. Pemutar siap.' : 'Terhubung. Menyiapkan pemutar…'}</p><button class="btn ghost" data-act="spdisc">Putuskan</button>`
    : `<div class="field" style="margin:10px 0"><input id="spcid" value="${esc(a.cid || '')}" placeholder="Client ID" autocomplete="off"></div><button class="btn" data-act="spconnect">Hubungkan</button>`}</div>`;
}

/* ===== YouTube: embed resmi, tanpa API key / login ===== */
let yt = null, ytLive = false, ytPlaying = false, ytDur = 0, ytScript = false;
function parseYT(u) {
  let x; try { x = new URL(u); } catch { return null; }
  const h = x.hostname.replace(/^(www|m|music)\./, ''), ok = s => s && /^[\w-]{11}$/.test(s) ? s : null;
  if (h === 'youtu.be') return { id: ok(x.pathname.slice(1, 12)), list: x.searchParams.get('list') };
  if (h !== 'youtube.com') return null;
  const m = x.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/), id = ok(x.searchParams.get('v')) || (m && m[1]), list = x.searchParams.get('list');
  return id || list ? { id, list } : null;
}
function ytLoad() {
  return new Promise(res => {
    if (yt && yt.loadVideoById) return res();
    if (!ytScript) {
      ytScript = true;
      window.onYouTubeIframeAPIReady = () => { yt = new YT.Player('yt-box', { width: '100%', height: '100%', playerVars: { playsinline: 1, rel: 0 }, events: { onReady: () => res(), onStateChange: ytState, onError: ytErr } }); };
      const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
    } else { const t = setInterval(() => { if (yt && yt.loadVideoById) { clearInterval(t); res(); } }, 200); }
  });
}
async function ytPlay(s) {
  ytLive = true; ytPlaying = false; ytDur = 0; $('#yt').classList.add('show');
  await ytLoad(); if (cur !== s) return;
  yt.setVolume($('#vol').value * 100);
  s.ytList ? yt.loadPlaylist({ list: s.ytList, listType: 'playlist' }) : yt.loadVideoById(s.ytId);
}
function ytStop() { if (ytLive && yt && yt.pauseVideo) yt.pauseVideo(); ytLive = false; ytPlaying = false; $('#yt').classList.remove('show'); }
function ytState(e) {
  const st = e.data; ytPlaying = st === 1;
  if (st === 1) {
    ytDur = yt.getDuration() || 0;
    if (cur && cur.ytList) { const d = yt.getVideoData(); cur.title = d.title || cur.title; cur.artist = d.author || cur.artist; cur.art = `https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`; }
  }
  if (st === 0 && !(cur && cur.ytList)) step(1, true);
  paint();
}
function ytErr() { toast('Video tidak bisa diputar (dibatasi pemiliknya)'); if (queue.length > 1) step(1, true); }
setInterval(() => {
  if (!ytLive || !ytPlaying || seeking || !yt.getCurrentTime) return;
  const t = yt.getCurrentTime(), d = yt.getDuration() || ytDur, p = d ? t / d * 100 : 0; ytDur = d;
  $('#bar-prog i').style.width = p + '%'; $('#seek').value = p; $('#t-cur').textContent = fmt(t); $('#t-dur').textContent = fmt(d);
}, 500);
async function ytImport(p, err, b) {
  if (p.id && S.songs.some(s => s.ytId === p.id) || !p.id && S.songs.some(s => s.ytList === p.list)) return err.textContent = 'Item ini sudah ada di library.';
  if (!p.id) { S.songs.push({ id: uid(), src: 'youtube', ytList: p.list, title: 'Playlist YouTube', artist: 'YouTube', album: 'YouTube', art: '', dur: 0, added: Date.now(), imported: true }); save(); closeModal(); toast('Playlist ditambahkan'); return render(); }
  err.textContent = 'Mengambil data…'; b.disabled = true;
  let r = null, j = {};
  try { r = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + p.id)); if (r.ok) j = await r.json(); } catch { r = null; }
  if (r && !r.ok) { b.disabled = false; return err.textContent = 'Video tidak ditemukan atau tidak boleh disematkan.'; }
  S.songs.push({ id: uid(), src: 'youtube', ytId: p.id, title: j.title || 'Video YouTube', artist: j.author_name || 'YouTube', album: 'YouTube', art: `https://i.ytimg.com/vi/${p.id}/hqdefault.jpg`, dur: 0, added: Date.now(), imported: true });
  save(); closeModal(); toast('Lagu ditambahkan'); render();
}

/* ===== Boot ===== */
applyTheme();
view.innerHTML = '<div class="page"><div class="row"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>';
window.addEventListener('load', async () => { icons(); await spCallback(); spInit(); setTimeout(render, 250); });
